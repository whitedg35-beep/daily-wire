<!-- ============================================================
     PIECE: WINNING TICKET
     What it is: a named ticket piece type. The face STATES THE
     WIN: the word WINNING TICKET as the headline line, the
     winner's name on the brand line, and the NIGHT STAMP in
     the meta — the date of the night of the win. It is handed
     to the winner as a gift, with the standard ticket back
     ("THE WIRE CARRIED IT LIVE" · PASS THIS TICKET ON).
     Drops into: the HERO drop zone of any format — the same
     sideways hero slot the hero ticket uses (3.5in x 2.5in on
     the page; scaled per format, 7:5 ratio kept). It is the
     hero ticket's markup with win content: same hooks, same
     slot, NO frame edits.
     Skin comes from the frame CSS (.hero-ticket hooks, plus
     the .piece-winning-ticket marker). Scheme is the metal:
     FULL GOLD is the house default for a win.
     Per strike: swap the winner's name, the win line, and
     the night stamp only — never the dimensions.
     Sample below: the house's own first winning ticket.
     ============================================================ -->
<div class="hero-wrap">
  <div class="hero-ticket piece-winning-ticket">
    <div class="ticket-main">
      <div class="ticket-brand">Live Wire Ticket&trade; &middot; Vice City Wire</div>
      <div class="ticket-headline">Winning Ticket</div>
      <div class="ticket-meta">Night of the Win &mdash; Nov 22, 2026 &middot; No. 0002</div>
      <div class="ticket-micro">Valid for one person &ndash; Doors 7PM &ndash; Show 8PM &ndash; No refunds</div>
    </div>
    <div class="ticket-stub"><span class="stub-text">Admit One</span></div>
  </div>
</div>
