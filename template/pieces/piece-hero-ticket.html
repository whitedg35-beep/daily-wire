<!-- ============================================================
     PIECE: HERO TICKET (the sideways ticket)
     What it is: the standard card turned sideways — 3.5in wide
     x 2.5in tall, a real ticket's natural shape — laid IN FRONT
     of the paper as the main piece. It carries the LIVE WIRE
     TICKET&trade; face treatment and the issue's main headline.
     Drops into: the HERO drop zone — between the banner headline
     and the article grid. The frame lays it over the top of the
     grid (overlap, shadow, one degree of rotation are FRAME
     behavior — do not restyle here).
     Skin comes from the frame CSS (.hero-ticket). Per issue:
     swap the headline, the ticket number, and the meta line.
     Sample below: The Daily Wire, issue No. 2 / Ticket No. 0002.

     Slot-size variants (see README): for a physical ticket laid
     on the printed page, cut the hero at 3.55in x 2.55in (bleed,
     glue-on) or open a 3.4in x 2.4in window (slide-behind).
     ============================================================ -->
<div class="hero-wrap">
  <div class="hero-ticket">
    <div class="ticket-main">
      <div class="ticket-brand">Live Wire Ticket&trade; &middot; Vice City Wire</div>
      <div class="ticket-headline">The Bridge Doesn&rsquo;t Connect</div>
      <div class="ticket-meta">No. 0002 &middot; @vicecitywire92</div>
      <div class="ticket-micro">Valid for one person &ndash; Doors 7PM &ndash; Show 8PM &ndash; No refunds</div>
    </div>
    <div class="ticket-stub"><span class="stub-text">Admit One</span></div>
  </div>
</div>
