<!-- ============================================================
     PIECE: TEXT POST
     What it is: a first-class piece type, equal to the ticket
     and the coin. A text post is CONTENT ONLY — a statement
     line and/or short body lines, nothing else. No art, no
     styling, no dimensions of its own.
     Drops into: any text-bearing drop zone on any surface —
     an article zone or the bottom strip of the newspaper, the
     stacked text zone of the vertical, a caption zone when it
     runs short. If a surface can carry text, this piece plugs
     into it as the new situation requires.
     Skin comes from the frame CSS (.piece-article hooks, plus
     the .piece-text-post marker). Do not add inline styles.
     Per post: swap the statement + lines only.
     SURFACE-INDEPENDENCE: the surface underneath does not
     matter. The scheme masks the piece for its surface, and
     frame-exactness keeps the presentation identical to the
     piece it replaces. See ../PLUG-IN.md.
     Sample below: a standing house line.
     ============================================================ -->
<article class="piece-article piece-text-post">
  <h3>We Just Started</h3>
  <p>One system, every surface. The paper reports it, the ticket hands it to you, the coin carries the mark where a ticket can't fit.</p>
</article>
