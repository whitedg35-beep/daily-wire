<!-- ============================================================
     PIECE: COIN INSERT (the face)
     What it is: the swappable FACE of the coin. The coin BASE
     (formats/coin/coin-frame.css) is the box — round blank,
     reeded edge, rim, the LIVE WIRE TICKET&trade; mark struck
     into the rim at fixed placements — and it never changes.
     The insert drops into the field and carries the face:
       - WIRE FACE (sample below): the house's own coin.
       - RECIPIENT FACE: the recipient's name + handle where
         the brand line sits; the issue line carries the
         occasion. Struck for one person, handed over private.
       - ISSUE FACE: the issue's headline where the brand line
         sits, the number in the meta — one per big issue.
     Drops into: the INSERT DROP ZONE inside .coin-rim, in the
     coin format's frame (formats/coin/coin-frame.html).
     Skin comes from the frame CSS (.coin-insert). Do not add
     inline styles. Per strike: swap brand line, issue line,
     meta, and the mini-ticket's line only.
     COLOR RULE: the insert wears SCHEME colors only, and the
     device is our own mark work — the mini sideways ticket.
     No real coin's artwork is ever copied onto a face.
     Sample below: the Wire face, Ticket No. 0002.
     ============================================================ -->
<div class="coin-insert">
  <div class="insert-brand">Vice City Wire</div>
  <div class="insert-ticket">
    <div class="it-main">Live Wire Ticket&trade;</div>
    <div class="it-stub"><span>Admit One</span></div>
  </div>
  <div class="insert-line">The Bridge Doesn&rsquo;t Connect</div>
  <div class="insert-meta">No. 0002 &middot; @vicecitywire92</div>
</div>
