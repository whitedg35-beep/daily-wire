<!-- ============================================================
     PIECE: HEADLINE (banner)
     What it is: the issue's main headline, full width, with its
     one-line standfirst under it.
     Drops into: the HEADLINE drop zone — directly under the
     sub-banner, in either edition's frame (frame/*-frame.html).
     Skin comes from the frame CSS (.piece-headline). Do not add
     inline styles. Per issue: swap the headline + standfirst
     text only.
     Sample below: The Daily Wire, issue No. 2.
     ============================================================ -->
<div class="piece-headline">
  <h1>The Bridge Doesn&rsquo;t Connect</h1>
  <p class="standfirst">A Leonida bridge that never meets in the middle &mdash; and the gap is the story.</p>
</div>
