<!-- ============================================================
     PIECE: ARTICLE
     What it is: one story block — a condensed headline (h3) and
     short justified paragraphs. Articles are the filler pieces
     of the grid: stack them in any column, or run two side by
     side in the bottom strip.
     Drops into: any column of the article grid, or the bottom
     strip, in either edition's frame.
     Skin comes from the frame CSS (.piece-article). Do not add
     inline styles. Per issue: swap headline + paragraphs.
     Sample below: The Daily Wire, issue No. 1.
     ============================================================ -->
<article class="piece-article">
  <h3>The City That Started It All</h3>
  <p><span class="dateline">Leonida &mdash;</span> Vice City first opened its gates in 2002. This week the state of Leonida opened for real, and Jason and Lucia are already the most-clipped duo in it.</p>
  <p>The Wire is watching every street.</p>
</article>
