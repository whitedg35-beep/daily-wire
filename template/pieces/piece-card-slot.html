<!-- ============================================================
     PIECE: CARD SLOT (upright)
     What it is: the secondary slot — an exact standard card
     frame, 2.5in wide x 3.5in tall (63.5 x 88.9 mm), drawn as a
     ticket: perforation stub along the bottom, ADMIT ONE in the
     stub. A printed LIVE WIRE TICKET&trade; card sits here, or
     the slot ships as the frame and the card drops in later.
     Drops into: the left or right column of the article grid,
     in either edition's frame. Follow it with a PIECE: CAPTION.
     Skin comes from the frame CSS (.piece-slot). Do not add
     inline styles. Per issue: swap the label + note only —
     NEVER the dimensions.

     Slot-size variants (see README): cut a physical card at
     2.55in x 3.55in (bleed, glue-on) or open a 2.4in x 3.4in
     window in the page (slide-behind).
     ============================================================ -->
<div class="piece-slot">
  <div class="slot-inner">
    <div class="slot-brand">Live Wire Ticket&trade;</div>
    <div class="slot-label">Place Ticket Here</div>
    <p class="slot-note">Card slot &mdash; 2.5 &times; 3.5 in, exact.</p>
  </div>
  <div class="slot-stub">Admit One</div>
</div>
