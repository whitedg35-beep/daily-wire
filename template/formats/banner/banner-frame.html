<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE DAILY WIRE — Banner Frame Skeleton</title>
<!-- ============================================================
     FRAME SKELETON — FORMAT: BANNER
     THE BOX, EMPTY, BANNER SHAPE. Wide 3:1, 1584 x 528, for
     profile and group covers: masthead LEFT, hero ticket
     sideways in front RIGHT, headline under the masthead.
     Everything marked FRAME is fixed and never changes;
     everything marked PIECE DROP ZONE is where a piece from
     ../../pieces/ goes.
     A new banner = this box + swapped pieces. Never rebuild.
     Scheme is a piece too: swap the scheme link below and the
     whole box changes color — frame and pieces untouched.
     ============================================================ -->
<link rel="stylesheet" href="../../schemes/wire-pink-teal.css">
<link rel="stylesheet" href="banner-frame.css">
</head>
<body>
<div class="page">

  <div class="banner-row">

    <div class="mast-zone">
      <!-- FRAME: masthead block — do not edit per issue -->
      <header class="masthead">
        <h1 class="masthead-title">THE DAILY WIRE</h1>
        <div class="gold-bar"></div>
        <div class="sub-banner">
          <span>Vice City Wire &middot; Leonida</span>
          <span class="sb-mid">Banner &mdash; Issue Line</span>
          <span>@vicecitywire92</span>
        </div>
      </header>

      <!-- PIECE DROP ZONE: headline (banner) — pieces/piece-headline.html -->
    </div>

    <!-- PIECE DROP ZONE: hero ticket — pieces/piece-hero-ticket.html -->

  </div>

  <!-- FRAME: footer — do not edit per issue -->
  <footer class="footer">
    <span>&copy; Bumkus &middot; Licensed, never sold &mdash; see LICENSE</span>
    <span class="pass">Pass This Ticket On</span>
  </footer>

</div>
</body>
</html>
