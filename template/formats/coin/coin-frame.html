<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE DAILY WIRE — Coin Frame Skeleton (The Token)</title>
<!-- ============================================================
     FRAME SKELETON — FORMAT: COIN (THE TOKEN)
     THE BOX, EMPTY, ROUND. The coin BASE is the box: round
     blank, reeded edge, raised rim, and the LIVE WIRE
     TICKET&trade; mark struck into the rim at fixed
     placements — all FRAME, never edited per strike.
     The FACE is a PIECE: swap the coin-insert and the same
     base carries a new face. Never rebuild the base.
     Scheme is a piece too: swap the scheme link below and the
     whole coin changes metal — frame and insert untouched.
     ============================================================ -->
<link rel="stylesheet" href="../../schemes/full-gold.css">
<link rel="stylesheet" href="coin-frame.css">
</head>
<body>
<div class="page">

  <!-- FRAME: slab label — do not edit per strike -->
  <div class="slab-label">
    <span class="slab-paper">THE DAILY WIRE</span>
    <span class="slab-meta">Token &mdash; Insert Line</span>
  </div>

  <!-- FRAME: the coin base — the box. Do not edit per strike. -->
  <div class="coin-stage">
    <div class="coin-base">
      <div class="coin-rim">
        <!-- FRAME: mark placement, struck into the rim — fixed -->
        <div class="coin-mark-top">Live Wire Ticket&trade;</div>
        <div class="coin-mark-bottom">Bumkus</div>

        <!-- PIECE DROP ZONE: coin insert (the face) — pieces/piece-coin-insert.html -->

      </div>
    </div>
  </div>

  <!-- PIECE DROP ZONE: caption — pieces/piece-caption.html -->

  <!-- FRAME: footer — do not edit per strike -->
  <footer class="footer">
    <span>&copy; Bumkus &middot; Licensed, never sold &mdash; see LICENSE</span>
    <span class="pass">Pass This Ticket On</span>
  </footer>

</div>
</body>
</html>
