<!DOCTYPE html>

<title>THE DAILY WIRE — Coin (The Token) — Wire Face, No. 0002</title>
<!-- ============================================================
     THE DAILY WIRE — COIN FORMAT (assembled sample)
     Built the house way: THE BASE STAYS, THE INSERT CHANGES.
     The coin base is FRAME — round blank, reeded edge, rim,
     the house mark struck into the rim. The face is PIECE:
     coin-insert (the Wire face). The SCHEME link below is
     FULL GOLD — swap it and the same base wears another
     metal; frame and insert untouched.
     The face is our LIVE WIRE TICKET&trade; mark in our
     colors — our mark work only, nothing borrowed.
     ============================================================ -->
<link rel="stylesheet" href="../../schemes/full-gold.css">
<link rel="stylesheet" href="coin-frame.css">
</head>
<body>
<div class="page">

  <!-- FRAME: slab label — do not edit per strike -->
  <div class="slab-label">
    <span class="slab-paper">THE DAILY WIRE</span>
    <span class="slab-meta">Token &mdash; No. 0002</span>
  </div>

  <!-- FRAME: the coin base — the box. Do not edit per strike. -->
  <div class="coin-stage">
    <div class="coin-base">
      <div class="coin-rim">
        <!-- FRAME: mark placement, struck into the rim — fixed -->
        <div class="coin-mark-top">Live Wire Ticket&trade;</div>
        <div class="coin-mark-bottom">Bumkus</div>

        <!-- PIECE: coin insert (the face — Wire face) -->
        <div class="coin-insert">
          <div class="insert-brand">Vice City Wire</div>
          <div class="insert-ticket">
            <div class="it-main">Live Wire Ticket&trade;</div>
            <div class="it-stub"><span>Admit One</span></div>
          </div>
          <div class="insert-line">The Bridge Doesn&rsquo;t Connect</div>
          <div class="insert-meta">No. 0002 &middot; @vicecitywire92</div>
        </div>

      </div>
    </div>
  </div>

  <!-- PIECE: caption -->
  <p class="piece-caption">The Token. Where a ticket can&rsquo;t fit, the coin carries the mark.</p>

  <!-- FRAME: footer — do not edit per strike -->
  <footer class="footer">
    <span>&copy; Bumkus &middot; Licensed, never sold &mdash; see LICENSE</span>
    <span class="pass">Pass This Ticket On</span>
  </footer>

</div>
</body>
