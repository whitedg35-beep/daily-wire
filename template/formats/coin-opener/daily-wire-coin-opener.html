<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE DAILY WIRE — Coin-Opener, Assembled Sample (No. 0002)</title>
<!-- ============================================================
     ASSEMBLED SAMPLE — FORMAT: COIN-OPENER
     The storyboard frame of the opener for Ticket No. 0002,
     "THE BRIDGE DOESN'T CONNECT": the page wakes (B0), the coin
     falls into place (B1), rolls gold (B2), shakes into marble
     (B3), the face falls in (B4), pops open to the square with
     the bridge reel inside (B5), and the back line closes (B6).
     This page is the still of the B5 moment — the coin has run
     B2–B4 (rolled gold, shook into marble, face fallen in) and
     popped open into the square, reel slot holding the issue's
     reel. The coin stage is therefore not in this still; the
     full seven-beat scaffold is coin-opener-frame.html. Frame
     and pieces are marked in comments, same discipline as
     every format.
     ============================================================ -->
<link rel="stylesheet" href="../../schemes/marble-gold-silver.css">
<link rel="stylesheet" href="coin-opener-frame.css">
</head>
<body>
<div class="page">

  <!-- BEAT B0–B1 FRAME: newspaper stage (THE DAILY WIRE, No. 2
       seated beneath; shadow sweep is frame behavior) -->
  <div class="stage-page">
    <div class="stage-shadow"></div>
  </div>

  <!-- BEAT B5 FRAME: square stage, open.
       The face the coin carried into the pop — PIECE: coin
       insert, the Wire face, No. 0002 ("VICE CITY WIRE / The
       Bridge Doesn't Connect / No. 0002 · @vicecitywire92") —
       is named on the opening beat; in the motion build it is
       the last thing seen before the square opens. -->
  <div class="stage-square">
    <!-- PIECE: REEL SLOT — the outer reel for this issue.
         Replace this reel and the opener runs a new piece;
         nothing else moves. -->
    <div class="reel-slot">Outer Reel &mdash; The Bridge Doesn&rsquo;t Connect</div>
  </div>

  <!-- BEAT B6 FRAME: back line -->
  <div class="back-line">The Wire Carried It Live &middot; <span class="pass">Pass This Ticket On</span> &middot; @vicecitywire92</div>

  <!-- FRAME: footer -->
  <footer class="footer">
    <span>&copy; Bumkus &middot; Licensed, never sold &mdash; see LICENSE</span>
    <span class="pass">Pass This Ticket On</span>
  </footer>

</div>
</body>
</html>
