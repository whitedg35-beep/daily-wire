<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE DAILY WIRE — Poster Frame Skeleton</title>
<!-- ============================================================
     FRAME SKELETON — FORMAT: POSTER
     THE BOX, EMPTY, POSTER SHAPE. Full-page Letter portrait:
     one banner headline, one big hero ticket sideways, one
     caption. Everything marked FRAME is fixed and never
     changes; everything marked PIECE DROP ZONE is where a
     piece from ../../pieces/ goes.
     A new poster = this box + swapped pieces. Never rebuild.
     Scheme is a piece too: swap the scheme link below and the
     whole box changes color — frame and pieces untouched.
     ============================================================ -->
<link rel="stylesheet" href="../../schemes/wire-pink-teal.css">
<link rel="stylesheet" href="poster-frame.css">
</head>
<body>
<div class="page">

  <!-- FRAME: masthead block — do not edit per issue -->
  <header class="masthead">
    <h1 class="masthead-title">THE DAILY WIRE</h1>
    <div class="gold-bar"></div>
    <div class="sub-banner">
      <span>Vice City Wire &middot; Leonida</span>
      <span class="sb-mid">Poster &mdash; Issue Line</span>
      <span>@vicecitywire92</span>
    </div>
  </header>

  <!-- PIECE DROP ZONE: headline (banner) — pieces/piece-headline.html -->

  <!-- PIECE DROP ZONE: hero ticket — pieces/piece-hero-ticket.html -->

  <!-- PIECE DROP ZONE: caption — pieces/piece-caption.html -->

  <!-- FRAME: footer — do not edit per issue -->
  <footer class="footer">
    <span>&copy; Bumkus &middot; Licensed, never sold &mdash; see LICENSE</span>
    <span class="pass">Pass This Ticket On</span>
  </footer>

</div>
</body>
</html>
