<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE WHITED DAILY — Frame Skeleton</title>
<!-- ============================================================
     FRAME SKELETON — THE WHITED DAILY
     THE BOX, EMPTY. Everything marked FRAME is fixed and never
     changes between issues. Everything marked PIECE DROP ZONE
     is where a piece from ../pieces/ goes.
     A new issue = this box + swapped pieces. Never rebuild.
     Scheme is a piece too: swap the scheme link below and the
     whole box changes color — frame and pieces untouched.
     ============================================================ -->
<link rel="stylesheet" href="../schemes/whited-silver-brass.css">
<link rel="stylesheet" href="whited-daily-frame.css">
</head>
<body>
<div class="page">

  <!-- FRAME: masthead block — do not edit per issue -->
  <header class="masthead">
    <h1 class="masthead-title">THE WHITED DAILY</h1>
    <div class="gold-bar"></div>
    <div class="sub-banner">
      <span>Branson, Missouri</span>
      <span class="sb-mid">The Whole Operation on One Page</span>
      <span>Garrett Whited</span>
    </div>
  </header>

  <!-- PIECE DROP ZONE: headline (banner) — pieces/piece-headline.html -->

  <!-- PIECE DROP ZONE: hero ticket — pieces/piece-hero-ticket.html -->

  <!-- FRAME: article grid — do not edit per issue -->
  <main class="article-grid">
    <div class="col">
      <!-- PIECE DROP ZONE: card slot — pieces/piece-card-slot.html -->
      <!-- PIECE DROP ZONE: caption — pieces/piece-caption.html -->
      <!-- PIECE DROP ZONE: article(s) — pieces/piece-article.html -->
    </div>
    <div class="col">
      <!-- PIECE DROP ZONE: shaped headline (optional) + article(s) -->
    </div>
    <div class="col">
      <!-- PIECE DROP ZONE: card slot — pieces/piece-card-slot.html -->
      <!-- PIECE DROP ZONE: caption — pieces/piece-caption.html -->
      <!-- PIECE DROP ZONE: article(s) — pieces/piece-article.html -->
    </div>
  </main>

  <!-- FRAME: bottom strip — do not edit per issue -->
  <section class="bottom-strip">
    <!-- PIECE DROP ZONE: article — pieces/piece-article.html -->
    <!-- PIECE DROP ZONE: article — pieces/piece-article.html -->
  </section>

  <!-- FRAME: footer — do not edit per issue -->
  <footer class="footer">
    <span>&copy; Bumkus &middot; Licensed, never sold &mdash; see LICENSE</span>
    <span class="pass">Pass This Ticket On</span>
  </footer>

</div>
</body>
</html>
